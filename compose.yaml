services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api@sha256:bd31dac802cfb3f416e9fec50a2470d0ec4f05175931a2953d99bdb55434361f
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_VERBOSITY: "0"
    volumes:
      - telegram-media:/var/lib/telegram-bot-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    env_file: .env
    environment:
      DATA_DIRECTORY: /data
      YOUTUBE_CREDENTIALS_FILE: /credentials/youtube-credentials.json
      YOUTUBE_CLIENT_SECRETS_FILE: /credentials/youtube-client-secret.json
      TIKTOK_CREDENTIALS_FILE: /credentials/tiktok-credentials.json
      WEB_BIND: 0.0.0.0
      WEB_PORT: 8080
    depends_on:
      telegram-bot-api:
        condition: service_started
    volumes:
      - telegram-media:/var/lib/telegram-bot-api
      - bot-data:/data
      - ./data:/credentials
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "post_uploader", "healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  telegram-media:
  bot-data:
